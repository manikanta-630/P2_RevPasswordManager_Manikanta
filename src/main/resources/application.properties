spring.application.name=RevPassword_P2

server.port=8080

# Database Configuration (Placeholder for existing Oracle DB)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=Mani123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate ddl-auto update is used to sync entities to DB if tables do not exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Thymeleaf cache
spring.thymeleaf.cache=false
